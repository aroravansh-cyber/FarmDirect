<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FarmDirect</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
    }

    .loader {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader::before {
      content: "";
      position: absolute;
      inset: -10px;

      background:
        linear-gradient(
          rgba(255, 255, 255, 0.25),
          rgba(255, 255, 255, 0.25)
        ),
        url("../assets/image/loader.jpg")
        center / cover no-repeat;

      filter: blur(5px);
      transform: scale(1.05);
    }

    .loader img {
      position: relative;
      z-index: 1;
      width: 180px;
      height: auto;
    }
  </style>
</head>

<body>

  <div class="loader">
    <img src="../assets/logo/logo.png" alt="FarmDirect">
  </div>

  <script>
    setTimeout(() => {
      window.location.href = "home.html";
    }, 2000);
  </script>

</body>
</html>
